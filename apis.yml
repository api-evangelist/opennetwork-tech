name: OpenNetwork Tech.
description: OpenNetwork Technologies was an identity and web access management software
  company known for web-based single sign-on (SSO), authentication, authorization, and
  federated identity products for web-enabled enterprise applications. Based in Clearwater,
  Florida, it raised venture funding led by Battery Ventures (with JP Morgan and SI Ventures).
  BMC Software acquired the company in March 2005 for roughly $18 million and folded it into
  BMC's Identity Management Business Unit. The company no longer operates as an independent
  entity and publishes no public API, developer portal, or machine-readable API artifacts.
